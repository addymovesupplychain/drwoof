<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWA Dashboard</title>
<style>
:root{color-scheme:light;--g:#0f3a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Poppins',-apple-system,Segoe UI,Arial,sans-serif;background:#f8fafc}
.top{height:46px;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--g);color:#fff}
.top h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.2px}
.tabs{display:flex;gap:4px;height:100%;align-items:flex-end}
.tab{border:0;background:transparent;color:#cfe3d7;font:500 13px inherit;font-family:inherit;padding:0 18px;height:36px;border-radius:8px 8px 0 0;cursor:pointer}
.tab:hover{color:#fff}
.tab.on{background:#f8fafc;color:var(--g);font-weight:600}
.src{margin-left:auto;font-size:11px;opacity:.75}
.pane{position:absolute;top:46px;left:0;right:0;bottom:0;display:none}
.pane.on{display:block}
iframe{width:100%;height:100%;border:0;background:#fff}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px;pointer-events:none}
</style></head>
<body>
<div class="top">
  <h1>DWA Dashboard</h1>
  <div class="tabs">
    <button class="tab on" data-t="raw">Raw Data</button>
    <button class="tab" data-t="meet">Meeting Mode</button>
  </div>
  <div class="src" id="src"></div>
</div>
<div class="pane on" id="p-raw"><div class="load">Loading Raw Data…</div></div>
<div class="pane" id="p-meet"><div class="load">Loading Meeting Mode…</div></div>
<script>
// Weekly roll: point these at the current files (same folder as this page).
const FILES={raw:"1_Snapshot.html",meet:"Meeting Oct 20.html"};

const loaded={};
function open(t){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
  document.getElementById("src").textContent=FILES[t];
  if(!loaded[t]){ // load each dashboard the first time its tab is opened, so its charts size correctly
    loaded[t]=true;
    const f=document.createElement("iframe");f.src=encodeURI(FILES[t]);f.title=t;
    f.onload=()=>{const l=document.querySelector("#p-"+t+" .load");if(l)l.remove();};
    document.getElementById("p-"+t).appendChild(f);
  }
  try{history.replaceState(null,"","#"+t);}catch(e){}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>open(b.dataset.t));
open(location.hash==="#meet"?"meet":"raw");
</script>
</body></html>
